<!doctype html>
<html lang="ur" dir="rtl">
<meta charset="utf-8">
<title>Wirasat frame fixture</title>
<link rel="stylesheet" href="/assets/css/app.css">
<!-- What the [zakat_wirasat] shortcode prints (MYZT_Frontend::wirasat), with the frame script inline. -->
<body style="margin:0;max-width:1100px">
<div class="myzt myzt-wirasat alignwide"><iframe class="myzt-wirasat-frame" src="/assets/wirasat/app.html?ver=test&amp;madhab=shafii" title="وراثت کیلکولیٹر اور شجرہ"></iframe><script>(function(){var f=document.currentScript.previousElementSibling;addEventListener('message',function(e){if(e.source===f.contentWindow&&e.data&&e.data.myztWirasatHeight>0){f.style.height=Math.min(e.data.myztWirasatHeight,20000)+'px';}});})();</script></div>
</body>
</html>
