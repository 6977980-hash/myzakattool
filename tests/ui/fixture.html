<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Zakat Tool UI fixture</title>
<link rel="stylesheet" href="/assets/css/app.css">
<script>
// Same shape as MYZT_Frontend::config(). Tests can override it with window.__MYZT_TEST (addInitScript).
(function () {
	var now = Math.floor(Date.now() / 1000);
	var cfg = {
		rates: { goldUsdOz: 4166.100098, silverUsdOz: 57.116001, fx: { pkr: 277.33821319, inr: 88.2, gbp: 0.75, eur: 0.86 }, updated: now - 600, fxUpdated: now - 600, source: 'gold-api' },
		country: 'PK',
		currencies: ['PKR', 'INR', 'USD', 'GBP', 'EUR'],
		restUrl: '/wp-json/myzakattool/v1/rates',
		jspdfUrl: '/assets/vendor/jspdf.umd.min.js',
		siteUrl: '/',
		email: 'contact@example.com',
		urls: { disclaimer: '/disclaimer/', methodology: '/methodology/', khums: '/khums-calculator/' },
		fitrana: { currency: 'PKR', wheat: '300', barley: '', dates: '', raisins: '', note: '' }
	};
	var o = window.__MYZT_TEST || {};
	for (var k in o) cfg[k] = o[k];
	window.MYZT = cfg;
})();
</script>
</head>
<body>
<div class="myzt myzt-calculator alignwide" data-widget="calculator"></div>
<div class="myzt myzt-goldrate" data-widget="goldrate" data-currency="PKR"></div>
<div class="myzt myzt-nisab" data-widget="nisab" data-currency="PKR"></div>
<div class="myzt myzt-fitrana" data-widget="fitrana"></div>
<div class="myzt myzt-fidya" data-widget="fidya"></div>
<div class="myzt myzt-khums" data-widget="khums"></div>
<div class="myzt myzt-hawl" data-widget="hawl"></div>
<div class="myzt myzt-ushr" data-widget="ushr"></div>
<script src="/assets/js/engine.js"></script>
<script src="/assets/js/pdf.js"></script>
<script src="/assets/js/app.js"></script>
</body>
</html>
